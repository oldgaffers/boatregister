  sales_text: |-
    Built 1939 in Brightlingsea by Douglas Stone *Blue Hawk* is a two berth small
    gaffer.  
    Ideal for weekends or day sailing although we have taken her from Titchmarsh to
    Lowestoft and entered the South Broads through Oulton Broad three times.  
    She had a big overhaul in 2015 including fitting a Yanmar 1GM 10. A new cockpit
    and teak locker lids. Improved cast lead ballast. Etc etc  
    She is 19’6” o/an over the deck and approximately 26’ over the rig.  
    Draught is 3’  
    Equipment includes fenders, warps, manual bilge pump, sea toilet, anchors,
    cockpit cover and bespoke all over winter cover.  
    Electrics inc Huminbird chart plotter, Nasa duet echo sounder and log. 12v
    sockets, cabin lights.
