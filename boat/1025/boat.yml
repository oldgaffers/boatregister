full_description: |-
  Masts and spars in Douglas fir including 7ft bowsprit.  Standing rigging
  galvanised wire with soft eyes hand spliced and served traditionally.  Running
  rigging all Marlowe hardy hemp with Jacobsen’s wooden shell and nylon sleeves. 
  Full set of sails, main (with 2 slab reefing points) staysail, jib, storm jib,
  topsail and genoa – all in good condition.  Lifting centreplate.  1 YANMAR 6.5
  hp inboard diesel in good condition.

  ST instrument – depth, cockpit and mainsail cover, 1 anchor.
