short_description: |-
  Ianthe has lived at Christchurch Sailing Club since at least 1909, probably
  longer. She is owned by a syndicate of 8, all of whom must be members of
  Christchurch Sailing Club.
full_description: |-
  ​Ianthe is a 24ft 6in gaff sloop with topsail, built in 1898 by Camper &
  Nicholsons and designed by Percival Hart, the Christchurch‑born naval architect
  whose early career included work for Berthon and several ​other major yards. Her
  lines were taken off by Jim Mottram​ in 1992.    

  Ianthe retains around 80% of her original timber. She is the last surviving
  example of the once‑competitive Christchurch racing class​.    

  Her long and stable ownership under Melvill Druitt (1907–1947) ensured her
  survival. Druitt, Commodore and long‑serving Honorary Secretary of Christchurch
  Sailing Club, raced her extensively​.    

  A restoration by Rossiter Yachts (2002–03) renewed her keel, centreboard case
  and garboards. ​Today Ianthe is maintained by an eight‑member syndicate within
  Christchurch Sailing Club​.​  

  There is an entry for Ianthe in the 1909 edition of Hunt’s Universal Yacht List,
  which was found at Cowes Library (entry number 1747). The entry was submitted in
  1908 by Melville Druitt.

  The boat wintered in the same shed, which was built for her (and her sisters)
  since 1913 at Christchurch Sailing Club.
