short_description: |-
  *Ianthe* has spent all her life at Christchurch Sailing Club.
full_description: |-
  *Ianthe* is a 24ft 6in gaff sloop with topsail, built in 1898 by Camper &
  Nicholsons and designed by Percival Hart, a Christchurch‑born naval architect
  whose early career included work for Berthon and Camper & Nicholsons.

  Constructed of Canadian yellow pine on oak frames with teak trim and a lead
  keel, Ianthe retains around 80% of her original timber. She is the last
  surviving example of a once‑competitive Christchurch racing type, which
  comprised *Ianthe, Iola,* and *Queen Bee.*

  *Ianthe* has spent all her life at Christchurch Sailing Club. Her original mast
  was replaced in 1993, made by her owner, Steve Renvoize. A restoration by
  Rossiter Yachts (2002–03) renewed her keel, centreboard case and garboards. She
  has never had an engine.

  There is an entry for *Ianthe* in the 1909 edition of Hunt’s Universal Yacht
  List, which was found at Cowes Library (entry number 1747). The entry was
  submitted in 1908 by Melville Druitt, an ex commodore of Christchurch Sailing
  Club and owner of *Ianthe* between 1916 and 1949. He stated that she was built
  by Campers.

  It had previously been believed that she was built by Inmans yard (now Berthon
  boatyard) at Lymington. Berthon was unable to find any record of her.

  In 1992, her lines were taken off by Jim Mottram, a boat builder and member of
  Christchurch Sailing Club. Her long ownership under Melvill Druitt (1907–1947)
  and subsequently R. Whittingham (1947 to 1979) helped to ensure her survival.

  In the summer, she is kept on a river mooring off Christchurch Sailing Club and
  has wintered in the same boatshed at the Club since 1913. She regularly attends
  the Yarmouth Old Gaffers Festival.

  Today *Ianthe* is owned and maintained by an eight-member syndicate within
  Christchurch Sailing Club
