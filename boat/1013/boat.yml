short_description: |-
  Ianthe has spent all her life at Christchurch Sailing Club.
full_description: |-
  *Ianthe* has spent all her life at Christchurch Sailing Club. Her original mast was replaced in 1993, made by her owner, Steve Renvoize, and her keel and centreboard were renewed in 2003 by Rossiters. She has never had an engine. She is owned by a syndicate of 8, all of whom must be members of Christchurch Sailing Club.

  There is an entry for Ianthe in the 1909 edition of Hunt’s Universal Yacht List, which was found at Cowes Library (entry number 1747). The entry was submitted in 1908 by Melville Druitt, an ex commodore of Christchurch Sailing Club and owner of Ianthe between 1916 and 1949. He stated that she was built by Campers.

  It had previously been believed that she was built by Inmans yard (now Berthon boatyard) at Lymington. Berthon was unable to find any record of her.

  The boat wintered in the same shed, which was built for her (and her sisters) since 1913 at Christchurch.
