construction_details: 'She is American yellow pine (this has been confirmed by laboratory
  analysis) on oak frames (1 1/4" x 7/8" on 8" centres), and of traditional carvel
  construction, using copper fastenings. She is 3/4 decked, and the deck planking
  is sheathed with e-glass. External underwater areas are sheathed with Kevlar using
  resorcinol adhesive. '
