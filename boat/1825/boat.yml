short_description: |-
  Cornubia was built for Pilot George Morrice in Polruan at Slade’s Yard on the
  Bristol Channel.
full_description: |-
  Comissioned in 1911 by Bristol channel pilot George Morrice from J Slade & Sons
  in Polruan, Cornwall, CORNUBIA operated as a pilot cutter for 10y out of Barry
  before she was sold in 1920  to become a yacht, renamed TROUBADOUR.

  From 1930 to 1982, she had a succession of 8 owners, was apparently sailed twice
  to America and back, and was loaned to the Sea Cadets on the Isle of Bute as a
  training ship during the Second World War by her then owner, the Earl of
  Dumfries. In 1939 he had renamed her HIRTA after the St Kilda island of that
  name that he owned and which he visited in the boat.

  In 1982 she was bought by the yachting author Tom Cunliffe and fitted out for
  ocean sailing on the Medina River in the Isle of Wight. Cunliffe with his young
  family sailed her to Norway, Iceland, the Faeroes and America in the wake of the
  Vikings and later wrote about the journey in ‘Topsail and Battleaxe’.  Other
  journeys In the same ownership included the Azores, West Indies, Russia,
  Denmark, Sweden, Estonia, Finland, Spain and France. In 1994, skippered by Tom
  Cunliffe, she was used in the BBC TV series ‘Island Race’ which was a three
  month circumnavigation of Britain featuring former hostage John McCarthy and
  broadcaster Sandi Toksvig.

  She was bought by Tony Winter in 1999 and fully rebuilt by T Nielsen of
  Gloucester 2004-2010, reverting to her original name CORNUBIA.  The current
  owner, Josh Danziger, bought her in in 2023 and in 2025 took her to Antigua and
  back to participate in the Antigua Classics Regatta.

  She has just completed her second circumnavigation of Britain and very recently
  participated in the vintage section of Cowes Week 200.

  Respecting the meaning of CORNUBIA as the medieval Latin name for Cornwall she
  now carries the image of a Cornish Chough as her mast top pennant.
