short_description: |-
  A gentleman's yacht built for cruising the Baltic.
full_description: |-
  Built as a gentleman's yacht for cruising the Baltic, 'Lilian' is the largest
  Petterson yacht known. She travelled to the Mediterranean in the 1930s and
  finally to northern France in 1938.

  She was restricted to the Thames until 1988, having become derelict as a Sea
  Cadet training ship at Windsor. She was restored and refurbished and attended
  the 1992 and 1996 Brest Festival of the Sea. She traveled to Stockholm in 1995.  
  In 2025 she cruised to Sweden, and was sold for a nominal £1 to the Motor Yacht
  Society. She is now part of a Swedish Heritage fleet.
