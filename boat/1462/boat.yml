full_description: |-
  *Eagle Owl* is a Cornish Shrimper. She has an inboard Yanmar 1GM10 diesel
  engine. GRP hull and wooden Spars. Her rig is technically gunter rig as the gaff
  can be hauled to lie parallel to the mast when not reefed. She has two berths
  and a galley. She is equipped with Garmin plotter, NMEA network with ships WIFI,
  ships radio, AIS transceiver. She has solar power.  

  She was ordered from Cornish Crabbers as a new build at the London Boat show by
  Gary Pearlman in Jan 1987 and delivered June 1987.

  The Pearlman's lived in Chalfont, Buckinghamshire at the time. She was named
  *Garatania* of Chalfont. Garatania was an anagram of family names together. Gary
  Pearlman was a keen sailor and had a holiday home in Salcombe so would often
  sail her there. Then she was moored in Topsham on the river Exe. Sadly Gary
  Pearlman died in 1999 aged only 46.

  From July 1999 she was owned and sailed by Robin Gibbon & Hew Naylor. She sailed
  at Tollesbury and in the Essex Estuary. She was renamed *Emily Anne*. Her first
  mooring was on the Stour at Manningtree. *Emily Anne* took part in the 2000 East
  Coast Rally followed by rallies in Holland and the Solent together with a number
  of regattas at such places as Aldeburgh, Waldringfield and Felixstowe Ferry.

  Robin was an ex-professional Ship's Master with a huge experience of sailing in
  a large variety of yachts of all sizes. With his experience, he became *Emily
  Anne*'s extremely successful skipper while Hew Naylor crewed. *Emily Anne* raced
  regularly and was always either first or second to Robin Whittle in *Bumble
  Chugger* (#124) which is an outboard Shrimper and was fierce competition. By
  2014 Robin and Hew were no longer fit enough to sail and put her up for sale.  

  In 2016 she was Bought by Nigel Emmett and moved to North Norfolk. He had
  previously owned and sailed a much newer Shrimper and hoped to do so again.
  However she wasn't sailed during this period. She needed considerable
  maintenance and restoration by then and after having her engine was rebuilt by
  Archer Engineering at considerable expense, was kept on the hard at Morston Near
  Blakeney. The following year when it become apparent that the work needed was
  more than could be accommodated she was put up for sale again.  

  In August 2017 she was bought by Ann Ingham her current owner and towed from
  Norfolk to Lancashire. Later that year she underwent repairs at Cornish Crabbers
  which included cockpit sole, centre plate casing, shroud plates, and rudder
  hangings. She was then berthed and sailed in Preston Dock to test her
  seaworthiness and following that on Consiston. In 2019 further restoration and
  improvements were carried out including fitting VHF radio and arial, AIS
  transceiver, dual batteries, new masthead lights, solar panel charging with VSR,
  Garmin plotter, auto bilge pump. And repainting the cabin. She was sailed in
  Plymouth where she was renamed Eagle Owl in a renaming ceremony on the water in
  Plymouth Harbour accompanied by fellow SOA members. Then she sailed on
  Derwentwater, and came to be berthed in her current home port of Lytham at
  Ribble Cruising Club.    
  In 2020 further modifications, repairs and maintenance were carried out
  including sanding to bare wood and Cetol to gaff and boom, new running rigging,
  new stove, re-galvanising the centre plate, stainless replacement fairleads,
  depth sounder fitted, cutlass bearing replaced, stuffing box renewed, engine
  serviced and new bunk cushions. She continued to sail in the Lytham Estuary when
  regulations allowed.  

  In 2021 further work entailed sanding and cetol to mast, rudder repair where
  mahogany had split, the hull under the water line was stripped and repainted
  with antifoul, sails repaired, pivoting bowsprit modification was installed, new
  Stainless steel fittings, and mast tabernacle blasted and powder coated. And she
  sailed at Lytham and attended SOA ISW Suffolk Rivers based at Suffolk Yacht
  Harbour on the River Orwell.  

  In 2022 in addition to regular sailing at her home port she attended the SOA
  Shrimper week at Largs. She also took part in the Ribble Cruising club Xmas
  Cruise in December, which was a short lived expedition as the was a hailstorm.  

  2023 saw *Eagle Owl* participate in the OGA60 party returning to Suffolk yacht
  harbour where tumultuous downpours over 5 days were not enough to dampen
  spirits. The OGA60 event for small boats on Ullswater in August had much better
  weather and *Eagle Owl* sailed the length of the lake. December saw *Eagle Owl*
  taking part in the xmas cruise in pleasant conditions crewed by pirates!  

  2024 *Eagle Owl* joined Shrimper week in Falmouth and sailed the LaLa rally
  through the Menai Straights from Conwy to Caernafon and back. In addition joined
  many activities in the Lytham estuary. 2025 saw *Eagle Owl* in Milford Haven and
  again on Ullswater. In 2026 *Eagle Owl* once again returned to Plymouth.  

  *Eagle Owl* is based at her home port at Lytham, although being a trailer sailor
  also resides at home out of season. Her crew comprises Bell and Brodie, two
  cockapoos, who can be seen in numerous photos. Human crew are always welcome.    
  2027 will be her 50th anniversary.
