  sales_text: |-
    or 98,000 euros.  
     *Lona III* is an iconic gaff cutter, launched in 1907 at William King’s  
    yard in Burnham-on-Crouch, by her architect Pain Clark. We restored  
    her thoroughly between 2011 and 2016 at Tradewind Yachts in The  
    Netherlands. *Lona III’*s website describes the extent of the  
    restoration work: https://bartcarpentier.wixsite.com/lona3  
    Upon her completion Classic Boat Magazine nominated *Lona III* for the  
    ‘Restoration of the year’ prize. The magazine published a beautiful  
    story in the September 2017 issue about Lona III’s homecoming trip to  
    Burnham-on-Crouch, written by Dick Durham.  

    We sail *Lona III* along the Belgian coast and in Dutch waters. She is a  
    very welcome guest at the classic boat events, and we are a member of  
    the Dutch OGA.  
    After 10 years of enjoyable sailing, the time has come to pass *Lona  
     III* on to a new owner that will take good care of her.  

    Tradewind Yachts has been maintaining *Lona III* since 2011 and is  
    handling the sale. See their website for the listing  
    https://tradewindyachts.nl/
