short_description: |-
  Robert  and Jan Holden's 30ft Gaff Cutter was designed and built by Andrew
  Anderson and Son at Penarth  in Wales in 1928. Then fully rebuilt in 1980 to1988
  - still retaining the Edwardian ambience.

  Now old age has caught up with me both physically and mentally and I must now
  pass Emanuel to a new custodian who will give her a lot of T.L.C.and bring her
  back to a pristine condition (words used in the past four surveys) .    
  Offers around £14k considered
full_description: |-
  Emanuel has a well-documented history, dating back to 1928, apart from the
  period 1937 - 1980. Her current owners have undertaken a major restoration and
  researched her history, available for browsing on the boat's website.
