full_description: |-
  Lovingly restored traditional mahogany sailing boat, double diagonally planked
  hull, epoxy sealed for durability. Believed to have been built in 1920’s at a
  boatyard in Poole. Beautifully restored in 2020 she has been lovingly maintained
  since then, and sailed in Poole Harbour.

  Gunter rigged, with jib, and a wooden mast, boom and bow sprit. The boat is
  fitted with a lifting galvanised iron keel and rudder. Classic day sailing boat
