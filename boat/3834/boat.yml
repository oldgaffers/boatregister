full_description: |-
  *Hunny* was designed and  built during covid lockdown. She is an open hull
  trimaran with an aluminium tripod mast supporting a single 17ft yard. The
  detachable sponsons allow easy assembly. The hull separates into 2 x 8ft 6 ins
  halves, bow and stern.
