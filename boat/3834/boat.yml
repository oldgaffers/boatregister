short_description: |-
  Well-maintained and classic Cornish Crabber 24 Mark 1, powered by a Yanmar 2GM20
  18hp inboard engine. Combining timeless tradition with reliable cruising
  performance, she’s fully equipped and ready for her next adventure.
full_description: |-
  Here is a streamlined, punchy rewrite designed to maximize impact for a sale
  listing while cutting

  **Key Highlights**

  * **Iconic & Beloved:** Single-family ownership from new; meticulously maintained and wintered ashore under cover every year.
  * **Overhauled Mechanics:** Repowered with a Yanmar 1GM10 (9hp) diesel in 2001; complete engine-out overhaul and bay strip/repaint in 2024.
  * **Rigging & Sails:** Traditional gaff rig with varnished spruce spars (tabernacle-mounted for easy lowering). Extensive tan sail wardrobe (Mainsail, Jib, Staysails, Topsails). Standing/running rigging regularly updated (Backstays NEW 2024).
  * **Condition & Deck:** Striking racing-green GRP hull with centreboard, spruce bowsprit, and beautifully finished iroko/ply brightwork (Deks Olje). Deep, safe cockpit.
  * **Accommodation:** Bright, cozy mahogany interior. V-berth forecabin with toilet, main saloon with drop-leaf table, and updated galley (2-burner hob/grill **NEW 2023**).

  **Specifications At A Glance**

  **FeatureDetails**   
  **LOA / LWL** | 7.35m / 6.00m   
  **Beam / Draft** | 2.44m / 1.42m (Centreboard down)   
  **Displacement** | 2,086 kg   
  **Hull / Keel** | GRP Monohull / Centreboard   
  **Engine** | Yanmar 1GM10 9hp Shaft Drive (25L Diesel Tank)   
  **Electrical** | 2x 12V batteries, alternator, solar trickle charger, battery
  management

  **Inventory Included**

  * **Navigation:** Compass, Fixed DSC VHF, NASA Depth Sounder & Clipper Wind, Nav lights, Clock.
  * **Deck & Canvas:** Fishermans & Bruce anchors, warps, fenders, boathook, sail cover.
  * **Safety:** Horseshoe buoy, throwing line, fire extinguisher, Whale bilge pump, horn, gas detector.
