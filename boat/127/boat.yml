short_description: |-
  Peggy H is a Plymouth hooker
full_description: |-
  The history of the*Peggy H* connects Cornish craftsmanship with a specific Devon
  fishing tradition, the Plymouth Hooker.  

  Despite the name, many Plymouth Hookers were actually built across the border in
  Cornwall, prized for the renowned skills of Cornish shipwrights. [1, 2]  
  Unlike trawlers that dragged nets along the seabed, Hookers fished using
  long-lining and hand-lining methods. A single boat could deploy long lines
  fitted with up to 3,000 baited hooks. This made them ideal for working deep
  waters (up to 50 miles past the Eddystone Lighthouse) or  
  targeting rocky, snag-heavy sea floors where nets would tear. They primarily
  targeted hake, mackerel, whiting, and bream.    
  To endure rough, open-shelf waters, these boats were heavily built out of carvel
  pitch pine on robust sawn oak frames. They are easily identified by
  their straight stems, deep heels, slightly raked transom sterns, and a long keel
  with a small amount of drag. They carried massive sail areas on long bowsprits
  to sprint back to market with their fresh catches.    
  Today, *Peggy H* belongs to an incredibly elite club. Only a handful of
  authentic historic Plymouth Hookers survive,
  including *Mizpah* (1885), *Spinaway* (1889), *Dayspring* (1896), and *Princess
  Marina* (1898).    
  **The Builde**r: Kitto of Porthleven  
  Richard Kitto established his yard in Porthleven around 1850. The firm (Kitto &
  Sons) grew into a powerhouse of West Country maritime industry as Kitto did not
  just build local fishing craft. The yard constructed  
  everything from massive ocean-going schooners and steam drifters to  
  specialized vessels for the Hudson’s Bay Company's Arctic expeditions.  
  Kitto was a massive local employer. Beyond the shipyard, the family pioneered
  Cornwall’s first industrial net-making loom in 1853, eventually supplying
  commercial, agricultural, and even military camouflage netting to the Admiralty
  before finally closing down in 1959.  
  Kitto boats were renowned for structural longevity. Aside from *Peggy  
  H*, another famous surviving Kitto build is the *Gleaner* (built in 1874), a
  65-foot Lowestoft drifter that was completely dismantled, saved from
  destruction, and painstakingly rebuilt to sail again.  

  Earliest History of Peggy H  
  While many details of her working-class life at sea were unrecorded, a clear
  picture of*Peggy H*'s origins can be traced through her register entries and
  broker archives.  
  [1897: Built as Lugger] ➔ [1897-1930s: Fished S. Coast] ➔ [1936: Yacht
  Conversion (G. Sartoris)]  

  1897 — The Launch: Peggy H was built by Richard Kitto in Porthleven using
  traditional carvel pitch pine on sawn oak frames. Crucially, she was not
  originally a cutter. She was launched as a lugger—meaning she originally carried
  asymmetric, four-sided lug sails, which were standard for Cornish working boats
  of the era.  
  For over three decades, she operated as a commercial hook-and-line fishing
  vessel, working hard along the rough South Coast of England.  
  As industrial steam and motor trawlers pushed traditional wooden sailing boats
  out of the commercial fishing industry, *Peggy H* faced destruction. She was
  saved in 1936 when she was purchased by a gentleman named G. Sartoris from
  Essex. Sartoris had her converted into a pleasure yacht by J. Prior at
  Burnham-on-Crouch. It was during this 1930s transition that her commercial
  lugger rig was replaced with a gaff sloop rig to make her manageable for a small
  private crew. She also received an early offset Thornycroft Handybilly petrol
  engine around  
  this era.  
  Here is the comprehensive history of *Peggy H* (OGA No. 127), incorporating the
  first-hand records, structural specifications, and personal anecdotes shared by
  owner Ron Crick in the  
  1980 Old Gaffers Association newsletter.    
  **Origins and Early History (1890s–1936)**  
  According to local fisherman lore, Peggy H was built in Porthleven,  
  Cornwall, sometime in the 1890s. She spent her early decades operating as a
  traditional working fishing boat. During this commercial era, although
  originally built with no engines, her propulsion  
  was later aided by two 7 h.p. Kelvin engines.  
  **The Yacht Conversion (1936–1950s)**  
  In 1936, an east coast sailor admired her distinct lines and bought  
  her out of the fishing trade. In a letter dated 1966, a Mr G. Sartoris of
  Ingatstone, Essex wrote he bought *Peggy H* in 1936. She was then taken to R.J.
  Prior’s yard in Burnham-on-Crouch, where she was extensively converted into a
  cruising pleasure yacht. Mr. Sartoris, chose to retain the original twin 7 h.p.
  Kelvin fishing engines.  
  Strikingly, despite being converted to a yacht, Prior's yard apparently never
  fitted her with a bowsprit. This missing spar threw off her sail balance, making
  her notoriously" hard-mouthed" (having heavy weather helm) during early North
  Sea and East Coast cruises.  
  Following Mr. Sartoris' ownership, her history became incredibly  
  vague. She was completely absent from official maritime registries until
  the 1950s.  
  In the early 1960s, she was discovered by Ron and Margy Crick. She  
  was a sad looking, neglected hulk resting on her side in the mud
  at Christchurch. She had been treated very poorly and had spent years serving
  strictly as a stationary houseboat rather than a sailing vessel.    
  The Cricks immediately moved on board. While Margy worked to financially support
  the project, Ron completely rebuilt the vessel section by section, even lifting
  all her internal iron ballast to inspect the hull planking.  
  To finally correct her steering handling, the Cricks built and  
  installed her very first bowsprit in the early 1960s. She was sailed out of
  Christchurch on spring tides. Drawing 5 feet of water on a bar that often only
  had 6 feet of water, her keel regularly and loudly thumped the shingle in the
  swells. To try and counter this, the crew hilariously resorted to "draping
  bodies" across the new bowsprit in an attempt to  
  leverage and lift the keel.  
  By this time, the old Kelvins had been replaced by two Thornycroft Handy Billy
  engines. Her sails consisted of a mismatched collection of worn-out cotton
  canvas that had faded from white to a dirty grey.
