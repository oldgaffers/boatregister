short_description: |-
  Plymouth Hooker converted to a yacht by Priors in 1936 for then owner Mr G
  Sartoris.
full_description: |-
  *Peggy H* was built by Richard Kitto in Porthleven using traditional carvel
  pitch pine on sawn oak frames. Crucially, she was not originally a cutter. She
  was launched as a lugger—and for over three decades, she operated as a
  commercial hook-and-line fishing vessel, working hard along the rough South
  Coast of England.  
  As industrial steam and motor trawlers pushed traditional wooden sailing boats
  out of the commercial fishing industry, *Peggy H* faced destruction. She was
  saved in 1936 when she was purchased by a gentleman named G. Sartoris from
  Essex. He had her converted into a pleasure yacht by J. Prior at
  Burnham-on-Crouch. It was during this 1930s transition that her commercial
  lugger rig was replaced with a gaff sloop rig to make her manageable for a small
  private crew. She also received an early offset Thornycroft 'Handybilly' petrol
  engine around this era.

  Despite being converted to a yacht, Prior's yard apparently never fitted her
  with a bowsprit. This missing spar threw off her sail balance, making her
  notoriously hard-mouthed (having heavy weather helm) during early North Sea and
  East Coast cruises.  
  Following Mr. Sartoris' ownership, her history became incredibly vague. She was
  completely absent from official maritime registries until the 1950s.  
  In the early 1960s, she was discovered by Ron and Margy Crick. She was a sad
  looking, neglected hulk resting on her side in the mud at Christchurch. She had
  been treated very poorly and had spent years serving strictly as a stationary
  houseboat rather than a sailing vessel.   
  The Cricks immediately moved on board. While Margy worked to financially support
  the project, Ron completely rebuilt the vessel section by section, even lifting
  all her internal iron ballast to inspect the hull planking. To finally correct
  her steering handling, the Cricks built and installed her very first bowsprit in
  the early 1960s.  
  *Peggy H* was sailed out of Christchurch on spring tides. Drawing 5 feet of
  water on a bar that often only had 6 feet of water, her keel regularly and
  loudly thumped the shingle in the swells. To try and counter this, the crew
  hilariously resorted to draping bodies across the new bowsprit in an attempt to
  leverage and lift the keel.  
  By this time, the old Kelvins had been replaced by two Thornycroft 'Handy Billy'
  engines. Her sails consisted of a mismatched collection of worn-out cotton
  canvas that had faded from white to a dirty grey.  
  Seeking a change from Christchurch, the Cricks moved *Peggy H* to Mike
  Richardson’s yard at Bursledon on the River Hamble. They eventually left the
  area when the rapid rise of modern marinas destroyed the local wildlife and
  marshes. They relocated across the Solent to the River Medina at Cowes, Isle of
  Wight.  
  During a famously windy Solent Old Gaffers Race in 1977 her old mast snapped and
  collapsed on deck. Ron custom-built a replacement mast by purchasing a spruce
  tree out of Parkhurst Forest for just £15 and hand-shaping it with an adze.  
  The twin-engine setup was cut down to a single shaft powered by a 9 h.p.
  Thornycroft Handy Billy. The space left behind by the second engine was
  repurposed into an expanded galley.    
  By 1980 her canvas had been upgraded by 1980 to modern Terylene sails, including
  a brand-new flat-cut mainsail to replace her historically baggy canvas.

  Following her documented time with Ron Crick on the River Medina in 1980, the
  trajectory of *Peggy H* shifted out of the liveaboard lifestyle and back into
  the active cruising and racing circuit.  
  In the late 1980s, *Peggy H* changed hands and was brought ashore for an
  extensive, sympathetic reconstruction. The focus was on preserving her authentic
  traditional build while making her reliably seaworthy. Her 1931 Thornycroft
  Handybilly petrol engine—an offset powerplant positioned through her port
  quarter—was completely overhauled and fully restored to working order by
  **1991**.  
  The refit overhauled her living quarters and safety systems. She received a new
  electrical system, modern navigation lights, custom interior upholstery, a
  classic heating stove, an echo sounder, a searchlight, and a traditional Blake
  Victory marine toilet (W/C).  
  Her sail plan was modernized with a matching suite of heavy-duty tan canvas
  sails, consisting of a tan mainsail, tan jib, and tan staysail, supplemented by
  a white light staysail.    
  In 1991She was listed for sale via the OGA network at the conclusion of this
  refit as a pristine example of a converted Plymouth Hooker, complete with 4
  berths and rare standing headroom under her coachroof.

  Following some time on the East Coast and the Solent, *Peggy H* eventually
  migrated back to her spiritual home in the West Country.  
  She took up permanent residence in [Penryn/Falmouth,
  Cornwall](https://www.google.com/search?kgmid=%2Fm%2F054gd8). She became a
  beloved local fixture in the Cornish classic boat community, transitioning back
  into private coastal cruising  
  Around 2015, *Peggy H* underwent another major structural refit to address the
  aging of her pitch-pine on oak hull, and by this time she had gained a new
  straight-laid iroko deck. She had a lot of frames replaced, all new planking in
  larch of the topsides, re-fastening below the water line, new coachroof in
  varnish mahogany, a new cockpit and new standing rigging all in 2015,   
  The structural stability gained from the 2015 refit allowed her to undertake
  blue-water passage-making across the English Channel. She proudly represented
  British maritime history abroad, appearing as a registered classic vessel at
  major international maritime festivals, including:  
  [Sail Brest 2016](https://www.google.com/search?q=Sail+Brest+2016)
  (International Maritime Festival in Brest, France  
  [Temps Fête Douarnenez
  2018](https://www.google.com/search?q=Temps+F%C3%AAte+Douarnenez+2018)
  (Douarnenez, France)  
  *Peggy H* is officially recognized on the National Historic Ships UK Register
  (Certificate No. 3563) as a vessel of historical significance. She continues to
  be maintained as an auxiliary gaff cutter in [Penryn,
  Cornwall](https://www.google.com/search?kgmid=%2Fm%2F054gd8), functioning as a
  well-loved and cared for, fully operational private cruising yacht. Her status
  remains a testament to over a century of continuous adaptation, from a Victorian
  hook-and-line fishing boat to a modern classic cruiser, whilst retaining all of
  her traditional charm.  

  Her more recent maintenance and refit work, was focused on reworking the
  interior of the boat, and some focus replacements to ensure her longevity. She
  is now planked above the waterline in Larch, her deck is straight-laid Iroko,
  traditionally payed and caulked with Scandinavian Pitch, she retains her
  Pitch-pine planking below the waterline, and oak sawn frames, deadwoods and
  keel, with the majority of her interior ballast having been replaced with lead
  (previously being iron-pigs). She also has a new gaff.  
  **Her future:** A full out of the water survey, focused not just on structural
  condition, but also on conservation and preservation, will look to assure her
  future for many years to come.

  The history of the **Peggy H** connects Cornish craftsmanship with a specific
  Devon fishing tradition.

  **The Plymouth Hooker**

  Despite the name, many Plymouth Hookers were actually built across the border in
  Cornwall, prized for the renowned skills of Cornish shipwrights.

  * **The Fishing Method:** Unlike trawlers that dragged nets along the seabed, Hookers fished using long-lining and hand-lining methods. A single boat could deploy long lines fitted with up to **3,000 baited hooks**. This made them ideal for working deep waters (up to 50 miles past the Eddystone Lighthouse) or targeting rocky, snag-heavy sea floors where nets would tear. They primarily targeted hake, mackerel, whiting, and bream.
  * **Design & Handling:** To endure rough, open-shelf waters, these boats were heavily built out of carvel pitch pine on robust sawn oak frames. They are easily identified by their **straight stems, deep heels, slightly raked transom sterns**, and a long keel with a small amount of drag. They carried massive sail areas on long bowsprits to sprint back to market with their fresh catches.
  * **Surviving Fleet:** Today, *Peggy H* belongs to an incredibly elite club. Only a handful of authentic historic Plymouth Hookers survive, including *Mizpah* (1885), *Spinaway* (1889), *Dayspring* (1896), and *Princess Marina* (1898).
  * **The Builder: Kitto of Porthleven**
  * [**Richard Kitto**](https://www.google.com/search?kgmid=%2Fg%2F11sw_6mwdp&q=Richard+Kitto) established his yard in Porthleven around **1850**. The firm (*Kitto & Sons*) grew into a powerhouse of West Country maritime industry.
  * **Versatility:** Kitto did not just build local fishing craft; the yard constructed everything from massive ocean-going schooners and steam drifters to specialized vessels for the Hudson’s Bay Company's Arctic expeditions.
  * **The Porthleven Industry:** Kitto was a massive local employer. Beyond the shipyard, the family pioneered Cornwall’s first industrial net-making loom in 1853, eventually supplying commercial, agricultural, and even military camouflage netting to the Admiralty before finally closing down in 1959.
  * **Legacy:** Kitto boats were renowned for structural longevity. Aside from *Peggy H*, another famous surviving Kitto build is the *Gleaner* (built in 1874), a 65-foot Lowestoft drifter that was completely dismantled, saved from destruction, and painstakingly rebuilt to sail again.
