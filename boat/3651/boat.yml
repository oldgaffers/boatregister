rig_type: Sloop
mainsail_type: balanced lug
short_description: |-
  Twin mast position, detachable bowsprit, sloop- or cat-rig.
full_description: |-
  *Wasp* is the only John Owles "Windchime" design ever built. She was displayed
  at the NEC in the 2022 Boat Life Live show alongside the celebrated Windsong
  racing dinghy. They share a very similar high performance lug rig that can
  either be sailed as a sloop or cat rigged when the mast stepped in the forward
  position. This, in effect, is the first reef. Her main has two further reef
  positions. When sloop rigged a bowsprit is fitted on the stem and a stub mast
  that extends the overall length by 31 inches.  
  Her construction is glued ply with oak transom and laminated mahogany stem. All
  trim, rudder, lead weighted centreboard, keel, thwarts, gunwales and knees are
  in Iroko. Mast, spars, bowsprit and stub mast are spruce. The tiller is ash.
  Almost all the fittings are from Davey and Co.  
    The high aspect main sail features a 6:1 luff tensioner in addition to the
  foot tensioner. Sprung outboard bracket fitted. Two long ash oars and rowlocks.  
  Sail area Main: 87.86sq ft. Jib 36.78sq ft
