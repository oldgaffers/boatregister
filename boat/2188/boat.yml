  sales_text: |-
    *Mizpah* is for sale at £11,750. She comes with a full set of sails
    (main serviced Winter 2025), two jibs (Nos 2 and 3), genoa, topsail,
    reaching sail and balloon spinnaker.
    All spars and wooden spinnaker poles.
    Anchor and chain, warps, lines and fenders, 
    a good quality and lightly-used road trailer (RM Trailers),
    2008 Tohatsu 3.5hp, outboard
    boom and cockpit covers. She has been professionally maintained
    throughout her life and properly stored in the winter in boatsheds 
    (from 2000 by AA Coombes in Bembridge and the Freshwater Boatyard
    St Mawes).
    She was given a new mast in 2015, a new (stainless steel) gooseneck
    in 2017, new standing rigging in 2021.
    Her topsides were re-painted in 2023 and she was antifouled for the 
    2026 season and her brightwork and spars sanded and varnished.
    She is ready to sail, currently lying on her mooring off Seaview,
    Isle of Wight.
