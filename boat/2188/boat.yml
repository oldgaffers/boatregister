short_description: |-
  *Mizpah* is a 1907 Seaview Mermaid design by G U Laws.
full_description: |-
  *Mizpah* was built on the Dart in 1994 by the renowned Pete Nash. She
  was built to the 1907 G.U. Laws’ design for the Sea View Mermaid. Her
  construction is larch on oak frames with teak decks. Pete Nash re-designed
  her sail plan and spars to increase the sail area of the main and to
  include a topsail. She has a bracket for an outboard motor with the motor
  itself being stowed beneath the counter.

  *Mizpah* has taken part in YOGAFF on a regular basis and has raced
  successfully in the Solent and in Falmouth for the last 27 years
  winning the Jubilee Trophy in the Round-the-Island on multiple occasions,
  the Long Tackle trophy at YOGAFF, the Otter Cup in the Town Regatta
  at Seaview (twice) as well as many other races. She is fast, exceptionally
  elegant with superb seakeeping and sailing performance in both light and 
  heavy airs. She was featured on the cover of Classic Boat for September 2012.
