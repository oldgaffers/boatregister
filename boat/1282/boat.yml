short_description: |-
  Sophie was originally built as a Falmouth Quay punt and later converted to a
  yacht, spending a short period of time with Bermudan rig.
full_description: |-
  Sophie was converted from a Falmouth Quay punt to a yacht in 1912, from gaff
  yawl in 1920 to cutter, then Bemudan in the 1940's. In 1946 a Morris petrol
  engine 948cc was installed.

  Her rig was returned to gaff cutter in 2006 during a major restoration started
  in 2001.
