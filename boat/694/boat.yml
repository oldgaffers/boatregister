short_description: |-
  Designed and built by Harry Feltham, Portsmouth, 1930 as a Bermudan cutter,
  *Nepenthe* was re-rigged as a gaff cutter in the 1960s.
full_description: |-
  > “Designed and built by Harry Feltham at Portsmouth in 1930 as a Bermudan cutter. Laid up at Birdham Canal during the war. Re-rigged as a gaff cutter in the 1960s. Found her way round to the Thames where she was acquired by Martin Hiley in 1976.”

  #### Description from the Drake 400, Plymouth, 1980 programme

  Martin Hiley and his wife cruised the boat extensively in the 1970s and early
  1980s with their small family, attending a number of OGA events along the South
  Coast. *Nepenthe* was noted for her ability to leak, the children putting on
  their wellies to go below! They had a curious habit of pushing matchsticks and
  plasticine into the top of the garboard seam from the inside! In those days she
  was painted dark green and had a pushpit.

  At University, Arabella, one of her current owners saw a photograph of *Nepenthe*
  and immediately asked about her.  Robert Fisher had apparently bought her as an
  insurance write off after she had been sat upon by another boat in the 1987
  storm, she was by then on the South East coast.  Full details are not known but
  it is assumed that her coach roof sides and cockpit were then replaced, as
  was the interior.  Much of the work was probably done by Robert Fisher himself
  who showed some skill as a carpenter - the chart table is particularly
  lovely.  The hull appears to have been largely unaffected although there are
  some sister ribs that may have been added following the storm damage. Robert
  sailed her extenisvely with his wife and son James. She was based on the East
  Coast around Brightlingsea and Woodbridge and made voyages to France, the Baltic
  and through the Dutch canals.  Arabella was invited aboard for two summer East
  Coast cruises.  She later lost contact with the family but fondly remembered the
  beautiful *Nepenthe*.  No leaks by the way, this problem must have been cured
  somewhere along the line, perhaps when being re-fitted after the storm.

  In 2004, she was spotted for sale and Arabella and her husband Roderick bought
  her at entirely the wrong time.....the same year as their first child was born!
   She was transported to Falmouth and has remained in the Roseland Peninsula ever
  since, currently moored in St Mawes.  Young children and a natural
  cautiousness have dictated some conservative inshore sailing in the area.
   She has been kept in good shape along the way and is as fast as you would
  expect off the wind.

  The name *Nepenthe* derives from a Greek weed or herb said to grant oblivion from
  all ills.  Whilst headaches have been indeed been caused by owning *Nepenthe* (or
  shall we just call them hangovers?) it is true to say that when you step aboard
  somehow all ones cares appear to be washed away.
