short_description: |-
  Designed and built by Harry Feltham, Portsmouth, 1930 as a Bermudan cutter,
  *Nepenthe* was re-rigged as a gaff cutter in the 1960s.
full_description: |-
  > “Designed and built by Harry Feltham at Portsmouth in 1930 as a Bermudan cutter. Laid up at Birdham Canal during the war. Re-rigged as a gaff cutter in the 1960s. Found her way round to the Thames where she was acquired by Martin Hiley in 1976.”

  Martin Hiley and his wife cruised the boat extensively in the 1970s and early
  1980s with their small family, attending a number of OGA events along the South
  Coast.  In those days she was painted dark green and had a pushpit.  

  Robert Fisher purchased her in 1990, she was by then on the South East coast.  
  Then painted cream and with no pushpit.  Robert sailed her extensively with his
  wife and son James. She was based on the East Coast around Brightlingsea and
  Woodbridge and made voyages to France, the Baltic and through the Dutch canals.  

  In 2004, she was purchased by her current owners and is sailed around the South
  West from the Falmouth area.

  The name *Nepenthe* has not changed since launch and derives from a Greek weed
  or herb said to grant oblivion from all ills.
