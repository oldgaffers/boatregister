short_description: |-
  'Vindilis' was Harrison Butler’s own boat built in 1935 to replace his Plymouth Hooker type gaffer named 'Sandook'.
full_description: |-
  Harrison Butler was a well-known amateur designer at the time who championed the
  metacentric theory. He aimed for balance and boats that sailed themselves. When
  it came to his own boat, he selected the Davinka design and confusingly named
  her 'Vindilis' (as this was the name of another of his designs).

  Moody’s had decided to expand their repair business into yacht building. When he
  heard this, Harrison Butler placed an order for the first boat.

  'Vindilis' is the first Moody. Her sister ship 'Lindy 2' was build number 3 and
  is also berthed in Emsworth Yacht Harbour. 'Lindy' still has her original rig
  but the previous owner converted 'Vindilis' to a cutter and she has been left in
  this form.

  Harrison Butler contributed at least two articles to Yachting Monthly in 1935
  and 1936. One of these compares the performance of 'Vindilis' with a Bermudan
  yawl rig against his previous gaffer 'Sandook' (unsurprisingly, faster upwind
  but downwind the gaffer had the edge). This article reflected much of the debate
  at the time regarding the new Bermudan. In another article, a cruise through the
  Naval Review of 1937 is described with battleships moored the length of the
  Solent.

  The previous two owners based 'Vindilis' on the Clyde. She returned to the South
  Coast for the 2010 season under Richard & Helen Farmer's ownership.
