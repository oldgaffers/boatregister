short_description: |-
  *Storm 2* is a Mark 1 Cornish Crabber built in 1974. She has spent some time in
  Holland under the name of *Kornuit*.
full_description: |-
  Not much is known of the boat before 2013 when she was in Holland, known as
  *Kornuit*. She had not been used for about two years. She was brought to Essex
  in February 2013 where a new engine was installed, new sails, mast split and
  rewired. Some internal rot was repaired.
