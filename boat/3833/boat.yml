short_description: |-
  12 ft Smacks Boat. Early OGA mould.
full_description: |-
  Presumably a mould taken from a genuine wooden smack's boat. Now fitted with
  modernised balanced lug rig including 4:1 down haul on the luff, sail out haul
  and slab reefing with downhauls. Back haul (bleater) on the boom. Centre plate
  is steel with 2:1 lifting gear. Said to have been owned by someone in
  Manningtree, although a Guga is a Hebridean Gannet.
