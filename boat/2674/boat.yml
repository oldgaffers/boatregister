  sales_text: |-
    Memory 19, cabin version. The boat has been out of the water for several years,
    but was previously campaigned with some success in the Classic Regattas
    organised by the Northern Ireland Old Gaffers Association. New sails were
    purchased in 1998 from James Lawerence Sailmakers, who also serviced the main in
    2005. Comes with Mariner 6hp 4 stroke outboard, purchased in 2005. The decks
    were covered in Tek-Dek in 2003. A tender is included in the sale. There is a
    trailer, which is in need of servicing. A well maintained boat with a full
    inventory.
