  sales_text: |-
    Built by Charlie Ward at the renowned Norfolk Boatyard in 1997, *Zingaresca* is
    Norfolk Gypsy No. 115 and one of the younger boats in the fleet.

    She is a particularly well-cared-for example of this beautifully built and
    capable sailing boat. In more recent years she has seen relatively light use and
    has been stored on her road trailer when not sailing, helping to preserve her
    condition.

    She retains her original gelcoat, which is in very good condition, while the
    teak and exterior woodwork are also very good. Overall, she presents very well
    for a boat of her age.

    She is powered by a Yanmar 1GM10 diesel engine, which has been regularly
    serviced and is in very good working order. It starts readily at the push of a
    button and runs very well.

    A number of recent additions and upgrades make *Zingaresca* particularly well
    equipped and ready to enjoy.

    **Sails and sailing equipment**

    * New Jeckells sails, hardly used and in very good condition
    * Jib fitted with UV-protective sunstrip
    * Original sails also included
    * Upgraded Harken mainsheet jamming block
    * Upgraded Harken boom block
    * New Dyneema centreboard line, replacing the original wire

    **Covers**

    * New cockpit cover
    * New boom cover
    * Full cockpit tent

    **Engine and navigation**

    * Yanmar 1GM10 diesel engine
    * Depth gauge
    * VHF radio
    * Masthead and bow navigation lights

    **Other equipment**

    * Original Bramber break-back road trailer, in very good condition
    * Ensign, flagstaff and socket
    * Boarding ladder
    * Plus much more
