full_description: |-
  Onward of Ito

   For sale £11,500 ono

  An original Itchen Ferry Boat, Converted to yacht 1930

  LOA 7.47 m, LWL 7.31m, Max width 2.70m, Draft 1.20m

  Long keel with 3 ton Lead  with 3.65m Bow sprit,

  Designed by Joe White 1921

  Built in 1923 by WR Mollett at The Dispatch Motor and Lifeboat Co Southampton

  She’s all wood with oak and pine well preserve, with full red sailing rig,

  folding three blade prop and Bow thruster. Engine Yanmar 2GM20.  She has been
  well maintained and is in excellent condition .

  Celebrating her 100th year 2023 she successfully sailed around Britain.

  The interior is in very good condition with three bunks, Gas cooker, fridge,
  navigation table and  Baby Blake toilet.  She has good storage space under bunks
  and sides and forward storage space for sails fenders and inflatable dingy.

  A full article of her history was published in Classic Boat  June 1993

  Currently birthed at Greenwich Yacht Club.

  Contact Martin Goodrich 07956801755 martin,g394@gmail.com
